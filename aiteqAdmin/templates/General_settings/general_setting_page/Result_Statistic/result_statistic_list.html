{% extends 'aiteq/base_admin.html' %}
{% block title %} Result Statistics {% endblock %}
{% block content %}
{% load static %}

<div class="app-content-header mt-3 pt-3">
  <div class="container-fluid">
    <div class="row">
      <div class="col-sm-6">
        <h4 class="mb-0">Result Statistics</h4>
      </div>
      <div class="col-sm-6">
        <ol class="breadcrumb float-sm-end">
          <li class="breadcrumb-item"><a href="{% url 'general_settings' %}">Settings</a></li>
          <li class="breadcrumb-item active">Result Statistics</li>
        </ol>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-lg-12">
    <div class="card">
      <div class="card-body">

        <!-- Top Actions -->
        <div class="row align-items-center mb-3 g-2">

          <div class="col-12 col-md">
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#resultStatisticCreateModal">
              <i class="ri-add-line me-1"></i> Add Result Statistic
            </button>
          </div>

          <!-- Search -->
          <div class="col-12 col-md-4">
            <input type="text"
                   class="form-control"
                   name="search"
                   placeholder="Search by title or value..."
                   hx-get="{% url 'get_details_result_statistic' %}"
                   hx-trigger="input change delay:300ms"
                   hx-target="#result-statistic-table-body"
                   hx-swap="innerHTML">
          </div>

        </div>

        <!-- Table -->
        <div class="table-responsive">
          <table class="table table-nowrap mb-0">
            <thead class="bg-primary">
              <tr>
                <th class="text-white">Sno</th>
                <th class="text-white">Icon</th>
                <th class="text-white">Title</th>
                <th class="text-white">Value</th>
                <th class="text-white">Order</th>
                <th class="text-white text-center">Status</th>
                <th class="text-white text-center">Actions</th>
              </tr>
            </thead>

            <tbody id="result-statistic-table-body"
                   hx-get="{% url 'get_details_result_statistic' %}"
                   hx-trigger="load once"
                   hx-swap="innerHTML">
            </tbody>
          </table>
        </div>

        <div class="d-flex justify-content-center mt-3" id="pagination_div_result_statistic"></div>

      </div>
    </div>
  </div>
</div>

<!-- ================= CREATE MODAL ================= -->
<div class="modal fade" id="resultStatisticCreateModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header bg-primary">
        <h5 class="modal-title text-white">Add Result Statistic</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <form method="POST" action="{% url 'result_statistic_list' %}">
          {% csrf_token %}

          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label>Title <span class="text-danger">*</span></label>
                <input type="text" name="title" class="form-control" placeholder="Ex: Projects Delivered" maxlength="200" required>
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3">
                <label>Value <span class="text-danger">*</span></label>
                <input type="text" name="value" class="form-control" placeholder="Ex: 150+, 98%, $3.2M" maxlength="100" required>
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3">
                <label>Icon Class <span class="text-danger">*</span></label>
                <input type="text" name="icon" class="form-control" placeholder="Ex: fas fa-chart-line" required>
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3">
                <label>Display Order</label>
                <input type="number" name="order" class="form-control" value="0">
              </div>
            </div>

            <div class="col-md-12">
              <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
              </div>
            </div>
          </div>

          <div class="form-check mb-3">
            <input type="checkbox" name="is_active" class="form-check-input" checked>
            <label class="form-check-label">Active</label>
          </div>

          <div class="text-center">
            <button class="btn btn-primary">Create</button>
            <button class="btn btn-light" data-bs-dismiss="modal" type="button">Cancel</button>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>

{% endblock %}
