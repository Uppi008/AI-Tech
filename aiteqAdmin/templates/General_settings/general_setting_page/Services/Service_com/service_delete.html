<div class="mt-2 text-center">
    <i class="{{ service.icon }} fa-3x text-danger"></i>
    
    <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
        <h4 class="text-danger">Are you sure?</h4>
        <p>Are you sure you want to delete the service</p>
        <p class="text-muted mb-0">
            <strong class="text-danger">"{{ service.title }}"</strong>?
        </p>
        <div class="mt-3">
            <small class="text-muted">
                <i class="ri-information-line me-1"></i>
                Category: <strong>{{ service.category }}</strong>
            </small>
        </div>
    </div>
</div>

<form method="POST" 
      action="{% url 'service_delete' service.id %}"
      hx-post="{% url 'service_delete' service.id %}"
      hx-target="#table-body-service"
      hx-swap="outerHTML">
    {% csrf_token %}
    
    <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
        <button type="button" class="btn w-sm btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" id="delete-btn" class="btn w-sm btn-danger">
            Yes, Delete it!
        </button>
    </div>
</form>
