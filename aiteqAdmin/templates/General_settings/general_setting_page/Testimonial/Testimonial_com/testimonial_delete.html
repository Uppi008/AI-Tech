<div class="mt-2 text-center">
    <i class="mdi mdi-alert-outline display-4 text-danger"></i>
    <div class="mt-4 pt-2 fs-15 mx-4 mx-sm-5">
        <h4>Are you sure?</h4>
        <p class="text-muted mx-4 mb-0">
            Are you sure you want to delete 
            <b class="text-danger">"{{ testimonial.name }}"</b> ?
        </p>
    </div>
</div>

<form method="POST" action="{% url 'testimonial_delete' testimonial.id %}"
      onsubmit="this.querySelector('#delete-btn').disabled=true;
                this.querySelector('#delete-btn').innerText='Deleting...';
                return true;">
    {% csrf_token %}
    <div class="d-flex gap-2 justify-content-center mt-4 mb-2">
        <button type="button" class="btn w-sm btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" id="delete-btn" class="btn w-sm btn-danger">Yes, Delete it!</button>
    </div>
</form>
